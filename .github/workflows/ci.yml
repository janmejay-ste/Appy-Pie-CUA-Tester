name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check (shared)
        run: pnpm --filter @cua/shared exec tsc --noEmit

      - name: TypeScript check (runner)
        run: pnpm --filter runner exec tsc --noEmit

      - name: TypeScript check (dashboard)
        run: pnpm --filter dashboard exec tsc --noEmit

      - name: Build
        run: pnpm build
