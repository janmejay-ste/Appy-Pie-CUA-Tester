name: "Create Connect - Google Sheets to Gmail Draft"
url: "https://connectcloud.appypie.com/connects"
requires_auth: true
category: e2e
instructions: |
  IMPORTANT UI PATTERN: This app uses a canvas + side panel layout. The main area shows workflow cards (trigger/action). Clicking a card opens a SIDE PANEL on the right with configuration details. If the side panel closes after clicking Continue, you MUST click the card again to re-open it. Configuration fields (dropdowns, inputs) are ONLY in the side panel — never on the canvas itself. If you cannot find expected fields, click the relevant card to open its panel.

  1. If login is required, log in with the provided credentials. Otherwise navigate to the Connect dashboard.
  2. On the /connects page, click "Create Connect". Dismiss any onboarding overlay or "Support Available" modal if they appear.
  3. TRIGGER SETUP — In the side panel:
     - Type "Google Sheets" in the search bar and select it from the app list
     
     - Select trigger event: "New Spreadsheet Row"
     - Click Continue
  4. GOOGLE SHEETS ACCOUNT — In the side panel:
     - If a linked account is already shown, click Continue
     - If no account is linked, click "Add an Account" to connect one
     - After clicking Continue, the side panel may close. If so, click the Google Sheets trigger CARD on the canvas to re-open the side panel.
  5. SPREADSHEET SELECTION — In the side panel (click the trigger card if panel is closed):
     - IGNORE the "guide" / "Example" toggle section — do NOT click it
     - Find the "Spreadsheet *" dropdown BELOW the guide section and click its ARROW ICON to open it
     - Wait 2-3 seconds for options to load, then select the first available spreadsheet
     - After selecting, find the "Worksheet *" dropdown below and select the first available worksheet
     - If clicking has no effect, try action "select" with target=elementId and value="first"
     - After both dropdowns are filled, click "Continue & Run Test" or "Skip Run Test"
  6. Click "Continue & Run Test" in the side panel:
     - Wait for the test to complete with a success message
     - Click "view record" to verify data, then click Continue to move to the action step
  7. ACTION SETUP — Click the "+" button or "Add Action App" on the canvas:
     - Search for "Gmail" and select it
     - Select action event: "Create Draft"
     - Click Continue
  8. GMAIL ACCOUNT — In the side panel:
     - If a linked account is shown, click Continue
     - If not, click "Add an Account" to connect one
  9. CONFIGURE DRAFT FIELDS — In the side panel:
     - Click the "Advance Mode" button to reveal the "To Email" field
     - Enter a value for "To Email" (e.g., test@example.com)
     - Enter "Test" in the "Subject" field
     - Enter "This is a test email body" in the "Email Body" field
     - Click "Continue & Run Test"
  10. Click "Activate Connect" button in the top-right corner:
      - If an "Upgrade Plan" popup appears, note the exact message and report it as a blocking issue
      - Otherwise verify activation success message
  11. Verify the workflow was created:
      - Connect status shows "ON" or "Active"
      - Trigger: Google Sheets / New Spreadsheet Row
      - Action: Gmail / Create Draft

  NOTE: If a 503 error or empty state appears, wait 3 seconds and retry once.
timeout: 300000
expected_outcome: "A connect workflow is created successfully where Trigger is Google Sheets (New Spreadsheet Row) and Action is Gmail (Create Draft). The workflow appears in the connects list with an active/ON status."
tags:
  - workflow
  - integration
  - google_sheets
  - gmail
  - connect_creation
  - e2e
  - automate
