name: "Create Connect - GoHighLevel V2 to Mindbody Sale"
url: "https://connectcloud.appypie.com/connects"
requires_auth: true
category: e2e
instructions: |
  ══ GLOBAL RULE — PAGE LOAD DISCIPLINE (applies to every single step below) ══
  Before performing ANY action (click, type, select, scroll), you MUST confirm the page
  or panel is fully loaded. The application is a SPA — every major click triggers an async
  re-render. Acting before it finishes causes no-effect clicks and wasted turns.

  MANDATORY PATTERN after every click that navigates, opens a panel, or submits a form:
    1. Issue a wait action (2000–3000ms depending on the operation)
    2. Take a screenshot
    3. Confirm the expected new state is visible (panel open, button present, fields rendered)
    4. ONLY THEN perform the next action
  If the expected state is not visible after the wait, wait again (1000–2000ms more) and
  re-check ONCE before concluding the click had no effect.

  Signs a page/panel is NOT yet loaded: grey overlay, spinner visible, panel still closed,
  buttons grayed-out or absent, previous state still showing. In all these cases: WAIT.
  Do NOT click again immediately — a second click on an unloaded page makes things worse.

  ── CANVAS DUAL-LOADER RULE — applies to EVERY canvas operation without exception ────────
  The connect editor canvas fires TWO loaders sequentially on EVERY interaction:
  opening the editor, clicking Continue, selecting an app, clicking "Add Action App",
  activating the connect — everything. The first loader has a visible spinner. The second
  loader fires silently the moment the first one clears, with no spinner, but it locks all
  interactive elements on the canvas. Acting between the two loaders causes failed clicks,
  missing buttons, and wasted turns.

  MANDATORY DUAL-LOADER WAIT PATTERN — execute this after EVERY action on the canvas:
    Step A: Wait 2000ms immediately after the action (3000ms for Continue/test actions).
    Step B: Take a screenshot.
            — If any spinner, overlay, or loading indicator is visible: wait 2000ms more,
              take another screenshot, repeat until the canvas looks visually clean.
            — If the canvas already looks clean: continue to Step C immediately.
    Step C: Wait an ADDITIONAL 1500ms unconditionally. This is the gap that absorbs the
            silent second loader. Do NOT skip this step even when the canvas looks ready.
            There is no visual cue for the second loader — you must always wait for it.
    Step D: Take a final screenshot and verify the expected element is present and the
            canvas is fully interactive before performing any further action.
            If the expected element is still absent, repeat Step C + Step D once more.

  HOW TO KNOW BOTH LOADERS ARE DONE — the "+" circle button:
  The round "+" circle button (data-tooltip="Add New Step") below any canvas node is the
  definitive signal that BOTH loaders have finished and the canvas is interactive.
  • Unconfigured trigger: grey "+" button visible below "Trigger Application" node
  • Configured trigger: BLUE "+" button + the three-button row (Add Action App | Add AI Agent | Add Flow)
  If "+" is absent after Step C → second loader is still running → wait 1500ms more.
  Never attempt to click canvas elements before the "+" circle is visible.

  This pattern replaces simple "wait Nms" calls at every canvas step below.
  ══════════════════════════════════════════════════════════════════════════════════════════

  1. If on redirection login is required then login with provided credentials, else navigate to the Connect dashboard
  2. If the /connects page shows an empty state with no existing connects (e.g., "No connects found", empty list, or only a "Create Connect" prompt), that is acceptable — proceed directly to Create Connect.
     Click on the "Create Connect" button. If a user guide or onboarding overlay appears, skip or dismiss it. Also close the Automate "Support Available" modal if it appears.
     → Apply the CANVAS DUAL-LOADER WAIT PATTERN after clicking Create Connect:
       Step A: Wait 2000ms. Step B: screenshot — if spinner visible, wait 2000ms more.
       Step C: wait an additional 1500ms after canvas first appears clean (second loader).
       Step D: confirm ALL of these before acting:
               • URL contains /customeditor/
               • "Trigger Application" node is visible on the canvas
               • A round "+" circle button is visible directly below the Trigger Application node
       The "+" button is the reliable signal that BOTH loaders have completed and the
       canvas is fully interactive. If "+" is absent, the second loader is still running —
       wait 1500ms more and check again. Do NOT interact until "+" is visible.

  3. In the Trigger section:
     - Click on the search/input field in the Trigger app selection area
     - Type "GoHighLevel" in the search field, then press Enter to trigger the search
     - WAIT 2000ms after pressing Enter, then confirm the grid has filtered to show GoHighLevel results
     - Look for "GoHighLevel V2" in the filtered results and CLICK on it
     - If no results appear, wait 1 more second and check again before retrying
     → Apply DUAL-LOADER WAIT PATTERN after clicking GoHighLevel V2, then confirm "Select Trigger Event" appears
     - Click on the "Select Trigger Event" dropdown/button to open it
     → Apply DUAL-LOADER WAIT PATTERN, then confirm the event list is visible with checkboxes
     - CLICK on "New Opportunity" in the list
     - Verify it is selected (checkbox checked or highlighted)
     - Click the "Continue" button at the bottom of the event list panel
     → Apply DUAL-LOADER WAIT PATTERN after clicking Continue, then confirm the account connection section has appeared
       (URL still contains /customeditor/ — if redirected to /connects, navigate back)

  4. For GoHighLevel V2 account:
     - Confirm the account section has loaded before acting
     - FIRST check if there is a dropdown/select to choose an existing connected account — if so,
       select the first available account, then click Continue
     - If a linked account is already shown with a Continue button, click Continue immediately
     - ONLY if no account dropdown AND no Continue button exist, click "Add an Account"
     - IMPORTANT: Do NOT click "Add an Account" if an existing account is already selectable
     → Apply DUAL-LOADER WAIT PATTERN after clicking Continue, then confirm the next panel (trigger fields or test) has loaded

  5. Configure the trigger fields:
     - If a "Select Location" or similar dropdown appears, wait for it to load, then select the first option
     - If a "Pipeline" dropdown appears, wait for it to load, then select the first option
     - Fill any other required fields with the first available option

  6. Click "Continue & Run Test" button to test the trigger
     → Apply DUAL-LOADER WAIT PATTERN (use 3000ms for Step A — test call takes time to return)
     - Verify the test ran successfully (confirmation message visible)
     - Do NOT click "View Record" — ignore it completely even if it appears

     ══ CRITICAL — PANEL DISMISSAL BEFORE ADD ACTION APP ══
     After the trigger test succeeds, the Trigger Details panel remains OPEN showing green
     checkmarks and a blue "Continue" button at the bottom. You MUST click this "Continue"
     button to CLOSE the panel. Do NOT attempt to click "Add Action App" while this panel
     is still open — the panel covers the canvas and the click will ALWAYS fail silently.
     The correct sequence is:
       1. See "Run Test is Successful" → click the "Continue" button in the panel
       2. Panel closes → canvas becomes fully visible with "Add Action App" row
       3. ONLY THEN click "Add Action App"
     ══════════════════════════════════════════════════════

     - Click the "Continue" button at the bottom of the Trigger Details panel to close it
     → Take a screenshot to verify the panel is closed and the canvas shows:
               • Trigger node shows "GoHighLevel V2" and "New Opportunity" (configured)
               • A round "+" circle button is visible directly below the trigger node
               • The three-button row "Add Action App | Add AI Agent | Add Flow" is visible
               HOW THESE APPEAR: after clicking Continue the "+" and three-button row appear
               AUTOMATICALLY — you do NOT need to click "+" first.
               If absent, wait 1500ms more (silent second canvas loader).

  7. Click the "+" circle below the trigger node on the canvas, or click "Add Action App"
     from the row that appears below the trigger node.
     → Apply the CANVAS DUAL-LOADER WAIT PATTERN after clicking:
       Step A: Wait 2000ms. Step B: screenshot — if spinner visible, wait 2000ms more.
       Step C: wait an additional 1500ms after canvas first looks clean (second loader).
       Step D: confirm the Action app search panel has opened on the right side.
     - Click the search/input field in the Action app selection area
     - Type "Mindbody" then press Enter to trigger the search
     → Apply DUAL-LOADER WAIT PATTERN after pressing Enter, then confirm results are filtered to show Mindbody
     - Click on "Mindbody" or "MINDBODY" from the filtered results
     → Apply DUAL-LOADER WAIT PATTERN, then confirm the action event list has appeared
     - Select action event: Create Sale
     → Apply DUAL-LOADER WAIT PATTERN, then confirm the account/Continue step for Mindbody has loaded

  8. For Mindbody account:
     - Confirm the account section has loaded before acting
     - FIRST check if there is a dropdown/select to choose an existing connected account — if so,
       select the first available account, then click Continue
     - If a linked account is already shown with a Continue button, click Continue immediately
     - ONLY if no account dropdown AND no Continue button exist, click "Add an Account"
     → Apply DUAL-LOADER WAIT PATTERN after clicking Continue, then confirm the Create Sale fields form has loaded
  9. Configure the Create Sale fields — IMPORTANT: The form is long and some fields load dynamically. Follow this exact order:

     ══ FULL-FORM VERIFICATION — DO THIS BEFORE FILLING ANY FIELD ══
     When the Action Details form first loads, SCROLL TO THE TOP and scan every field
     from top to bottom. ASSUME NOTHING IS PRE-FILLED — every new connect starts with
     an empty form. You must visually confirm each required field (*) has a value before
     moving on. Required fields are marked with a red asterisk (*) in their label.
     Empty field signs: blank dropdown, blank input, "+ Add or Select" button still showing.
     Filled field signs: dropdown shows a selected value, picker shows a mapped value.
     Do NOT rely on the "Continue & Run Test" button color to determine if fields are
     filled — the button can appear blue even when all fields are empty.
     ══════════════════════════════════════════════════════════════════════════════════

     HOW "Add or Select" PICKERS WORK — applies to Product, Quantity, Amount, Payments Type:
        These fields use a two-step custom picker widget. Do NOT just type into the field label.
        Step 1: Click the "+ Add or Select" button. The button disappears and a NEW dropdown
                opens with a search input inside it. DOM changes after this click.
        Step 2: Find and type your value into the NEW input element that appeared INSIDE the
                opened picker. This is a DIFFERENT element ID than the button you just clicked.
                The original button element no longer accepts input.
        Step 3: After typing, either click the "Use '...' as custom text" option that appears,
                or press Enter, to confirm the value.
        IMPORTANT: If your type action has NO EFFECT, you typed into the wrong element.
                   Look for the new input that appeared after the picker opened and type there.

     a. Select Site List — SCROLL TO TOP of the Action Details panel first so the field is
        visible before clicking. Then click the dropdown and select "appy pie sandbox" or the
        first available site. IMPORTANT: only click the field when it is VISIBLE in the viewport;
        clicking an off-screen element always has no effect.
        After selecting, the form will load additional fields (ClientId, UniqueClientId, Product)
        that depend on the site selection. Wait 1-2 seconds for them to appear.

     b. ClientId — map a dynamic value from GoHighLevel trigger output:
        - Click on the ClientId field to open the mapping dropdown
        - Select a value like contact email or contact id from the trigger data
        - If the field shows "Please fill site_list,username,password before select client id",
          make sure Site List is selected first, then retry

     c. Product — appears below ClientId after site selection loads it.
        Click "+ Add or Select", wait for the picker to open, then type in the NEW input inside
        the picker to search for a product (e.g. "laptoptesting") and select it.
        This is CRITICAL: it satisfies the required "Items" parameter. Without this the test
        WILL fail with "Items is a required parameter".

     d. Quantity — uses the same "Add or Select" two-step picker described above.
        Click "+ Add or Select", then type "1" into the NEW input inside the opened picker,
        then press Enter or click "Use '1' as custom text" to confirm.

     e. Amount — uses the same "Add or Select" two-step picker described above.
        Click "+ Add or Select", then type "20" into the NEW input inside the opened picker,
        then press Enter or click "Use '20' as custom text" to confirm.
        DO NOT type "20" into the original button element — that will have no effect.

     f. SCROLL DOWN in the Action Details panel to reveal the remaining fields:
        Location, Send Email, Payments Type, and Item Type appear immediately below Amount.

     g. Location — click the dropdown and select the first available location
        (e.g. "appy pie sandbox - California City,New York").

     h. Send Email — click the dropdown and select "True".

     i. Payments Type — uses the "Add or Select" two-step picker.
        Click "+ Add or Select", then in the opened picker select or type "Cash".

     j. Item Type — click the dropdown and select "product".

     k. SCROLL THROUGH the entire form top-to-bottom one final time to verify:
        - Site List has a selected value (not blank)
        - ClientId has a mapped value (not blank, not showing "Please fill site_list first")
        - Product has a value (not blank) — required for Items parameter
        - Quantity has a value (not blank)
        - Amount has a value (not blank)
        - Location has a selected value (not blank)
        - Send Email has a selected value (not blank)
        - Payments Type has a value (not blank)
        If ANY of the above is still empty, fill it before proceeding.
        Service, Package, Staff, Sale Date, Notes, Promotion Code are OPTIONAL — skip them.

  10. Only after confirming all required fields above have values, click "Continue & Run Test".
      Do NOT rely on the button color — always verify fields visually before clicking.
      → Apply DUAL-LOADER WAIT PATTERN (use 3000ms for Step A)
  11. ERROR HANDLING — If the action test fails:
      - Read the error message carefully. Common errors and how to fix them:
        a. "Items is a required parameter" → go back and ensure Product, Service, or Package has a value selected via "Add or Select". If Product dropdown is empty, try Service or Package instead
        b. "ClientId is a required parameter" → go back and map a value for the ClientId field from the trigger output dropdown
        c. "LocationId is a required parameter" → go back and select a Location from the dropdown
        d. "PaymentMethodId" or payment-related error → go back, find Payments Type field, click "Add or Select" and choose the first available option
        e. Any other "X is a required parameter" error → scroll through the form, find the field named X, and fill it with the first available option from its dropdown or enter a test value
        f. If a field requires a prerequisite (e.g. "Please fill site_list first"), ensure the prerequisite field is filled, then retry
      - After fixing the missing field(s), click "Continue & Run Test" again
      - Repeat this fix cycle up to 3 times. If the test still fails after 3 attempts, report all error messages in the summary
  12. If the action test succeeds, check whether the Activate Connect button is active or not. If yes then enable the connect workflow by clicking on Activate Connect button
       → Apply DUAL-LOADER WAIT PATTERN after clicking Activate Connect
       - If an "Upgrade Plan" popup or any pricing/plan upgrade modal appears, do NOT dismiss it — instead note the exact popup title, message text, and which plan it suggests, then report this as a blocking issue in your summary
       - If no popup appears, verify that the connect workflow is activated successfully
  13. Verify the workflow was created successfully:
      - Workflow should appear in the connects list
      - Connect status should appear as "ON" or "Active"
      - Trigger application shows "GoHighLevel V2" with event "New Opportunity"
      - Action application shows "MINDBODY" with event "Create Sale"
  NOTE: If any page shows a 503 error or empty state, wait 3 seconds and retry once. If a 503 error occurs during trigger/action testing, wait and retry. Empty states (no existing data) are acceptable — proceed with the test flow.
timeout: 600000
max_turns: 70
expected_outcome: "A connect workflow is created successfully where Trigger is GoHighLevel V2 (New Opportunity) and Action is Mindbody (Create Sale) with Product/Item selected and ClientId mapped from trigger output. The workflow appears in the connects list with an active/ON status."
