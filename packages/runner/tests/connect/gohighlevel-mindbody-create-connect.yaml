name: "Create Connect - GoHighLevel V2 to Mindbody Sale"
url: "https://connectcloud.appypie.com/connects"
requires_auth: true
category: e2e
instructions: |
  1. If on redirection login is required then login with provided credentials, else navigate to the Connect dashboard
  2. If the /connects page shows an empty state with no existing connects (e.g., "No connects found", empty list, or only a "Create Connect" prompt), that is acceptable — proceed directly to Create Connect.
     Click on the "Create Connect" button. If a user guide or onboarding overlay appears, skip or dismiss it. Also close the Automate "Support Available" modal if it appears.
  3. In the Trigger section:
     - Click on the search/input field in the Trigger app selection area
     - Type "GoHighLevel" in the search field — do NOT press Enter if needed then press Enter. The search is live and results appear as you type
     - Wait 1-2 seconds for search results to appear as a dropdown/list below the search field
     - Look for "GoHighLevel V2" in the dropdown results and CLICK on it to select it
     - If no results appear after typing, try clearing the field and typing again slowly
     - After selecting GoHighLevel V2, a "Select Trigger Event" dropdown or section will appear
     - Click on the "Select Trigger Event" dropdown/button to open it
     - Wait for the event list to appear — it may take 1-2 seconds to load
     - Look for "New Opportunity" in the list — the events are displayed as checkboxes with labels
     - CLICK on the text/label "New Opportunity" (not the checkbox itself) to select it
     - After clicking, verify the event is selected (checkbox should be checked or highlighted)
     - Then click the "Continue" button at the bottom of the event list panel
     - IMPORTANT: After clicking Continue, verify you are STILL on the editor page (URL should contain /customeditor/). If you got redirected back to /connects, it means the event was not properly selected — navigate back to the editor and try again
  4. For GoHighLevel V2 account:
     - After selecting the trigger event, the account connection section should appear
     - If a linked account is already shown, click on the continue button to proceed to the next step
     - If no account is linked, click "Add an Account" to connect one
     - IMPORTANT: Do NOT click any button that takes you back to /connects — stay on the editor page
  5. Configure the trigger fields:
     - If a "Select Location" or similar dropdown appears, select the first available location
     - If a "Pipeline" dropdown appears, select the first available pipeline
     - Fill any other required fields with the first available option
  6. Click Continue & Run Test button to proceed with testing the trigger step
     - Verify that the test runs successfully with a confirmation message
     - Click view record to verify the opportunity data is displayed
     - Click continue to move to the action step
  7. Click on "+" to add an Action app and In the Action section:
     - Search for and select application: "Mindbody" or "MINDBODY"
     - Select action event: Create Sale
  8. For Mindbody account:
     - If a linked account is already shown, click continue to proceed
     - If no account is linked, click "Add an Account" to connect one
  9. Configure the Create Sale fields — IMPORTANT: The form is long, you MUST scroll down to see all fields. Follow this exact order:
     a. Select Site List — select "appy pie sandbox" or the first available site from the dropdown
     b. ClientId — map a dynamic value from GoHighLevel trigger output:
        - Click on the field, open the mapping dropdown
        - Select a value like contact email or contact id from the trigger data
        - If the field shows "Please fill site_list,username,password before select client id", make sure site is selected first
     c. SCROLL DOWN in the Action Details panel to reveal more fields below ClientId
     d. Product — click "Add or Select", select the first available product (e.g. "laptoptesting" or any listed product)
        - This is CRITICAL: it satisfies the required "Items" parameter. Without this the test WILL fail with "Items is a required parameter"
     e. Quantity — enter "1"
     f. Amount — enter "20" or any test numeric value
     g. SCROLL DOWN again to see Location, Send Email, Payments Type fields
     h. Location — select the first available location from dropdown (e.g. "appy pie sandbox - California City,New York")
     i. Send Email — select "True" from the dropdown
     j. Payments Type — click "Add or Select" and select "Cash" from the dropdown
     k. Item Type — select "product" from the dropdown
     l. SCROLL DOWN once more to check for any remaining required fields
     m. Service, Package, Staff, Sale Date, Notes — skip all these optional fields
  10. After all required fields are filled, click "Continue & Run Test" button
  11. ERROR HANDLING — If the action test fails:
      - Read the error message carefully. Common errors and how to fix them:
        a. "Items is a required parameter" → go back and ensure Product, Service, or Package has a value selected via "Add or Select". If Product dropdown is empty, try Service or Package instead
        b. "ClientId is a required parameter" → go back and map a value for the ClientId field from the trigger output dropdown
        c. "LocationId is a required parameter" → go back and select a Location from the dropdown
        d. "PaymentMethodId" or payment-related error → go back, find Payments Type field, click "Add or Select" and choose the first available option
        e. Any other "X is a required parameter" error → scroll through the form, find the field named X, and fill it with the first available option from its dropdown or enter a test value
        f. If a field requires a prerequisite (e.g. "Please fill site_list first"), ensure the prerequisite field is filled, then retry
      - After fixing the missing field(s), click "Continue & Run Test" again
      - Repeat this fix cycle up to 3 times. If the test still fails after 3 attempts, report all error messages in the summary
  12. If the action test succeeds, check whether the Activate Connect button is active or not. If yes then enable the connect workflow by clicking on Activate Connect button
       - If an "Upgrade Plan" popup or any pricing/plan upgrade modal appears, do NOT dismiss it — instead note the exact popup title, message text, and which plan it suggests, then report this as a blocking issue in your summary
       - If no popup appears, verify that the connect workflow is activated successfully
  13. Verify the workflow was created successfully:
      - Workflow should appear in the connects list
      - Connect status should appear as "ON" or "Active"
      - Trigger application shows "GoHighLevel V2" with event "New Opportunity"
      - Action application shows "MINDBODY" with event "Create Sale"
  NOTE: If any page shows a 503 error or empty state, wait 3 seconds and retry once. If a 503 error occurs during trigger/action testing, wait and retry. Empty states (no existing data) are acceptable — proceed with the test flow.
timeout: 360000
expected_outcome: "A connect workflow is created successfully where Trigger is GoHighLevel V2 (New Opportunity) and Action is Mindbody (Create Sale) with Product/Item selected and ClientId mapped from trigger output. The workflow appears in the connects list with an active/ON status."
