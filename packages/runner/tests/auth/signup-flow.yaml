name: "Login & Auth Flow"
url: "https://www.appypieautomate.ai"
requires_auth: true
category: e2e
instructions: |
  1. From the homepage, find and click the Login or Sign In button
  2. Wait for the login page/form to load completely
  3. Enter the test account email into the email field
  4. Enter the test account password into the password field
  5. Click the Sign In / Log In submit button
  6. Wait for the page to load after login
  7. Verify that login was successful by checking for:
     - A user dashboard or connects page
     - The user's name or email visible somewhere
     - No error messages displayed
     
  8. If login fails, note the exact error message
  9. After successful login, verify the navigation shows authenticated state (e.g., profile icon, logout option)
  NOTE: After login, the page may redirect to different URLs (e.g., /connects, /dashboard, or the homepage). If redirected to an empty dashboard with no data, that is still a successful login — verify authenticated state (profile icon, user name/email, logout option) is present.
  If any page shows a 503 error or empty state, wait 3 seconds and retry. Empty states (no existing data) are acceptable — proceed with the test flow.
timeout: 120000
expected_outcome: "User can log in successfully with test credentials, dashboard/connects page loads, authenticated navigation state visible"
tags: ["login", "auth", "e2e", "automate"]
