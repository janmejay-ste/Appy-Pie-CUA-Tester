name: "Header Navigation Menu"
url: "https://www.appypieautomate.ai"
category: smoke
instructions: |
  1. Verify the header/navigation bar is visible at the top of the homepage
  2. Check that these main navigation links are present: Features, Explore, AI Automation, MCP Servers, Pricing, Blog, Contact Sales
  3. If "Explore" has a dropdown, click to expand and verify sub-links are visible. Then click elsewhere to close the dropdown.
  4. Click "Pricing" — verify the Pricing page loads (check if pricing plans/cards are visible OR if a 404/410 error page appears — report either result)
  5. Navigate back to homepage by going to https://www.appypieautomate.ai (do NOT use browser back button)
  6. Click "Features" — verify the Features page loads with relevant content
  7. Navigate back to homepage by going to https://www.appypieautomate.ai
  8. Click "Blog" — verify the Blog page loads (note: Blog may use a different domain or header layout, this is acceptable)
  9. Navigate back to homepage by going to https://www.appypieautomate.ai
  10. Verify "Contact Sales" link is present and visible — do NOT click it (it opens Calendly in a new tab which may cause navigation issues)
  11. All navigation links verified and pages loaded — report PASS
timeout: 120000
expected_outcome: "Header nav links (Features, Explore, AI Automation, MCP Servers, Pricing, Blog, Contact Sales) are visible, Pricing and Features pages load, Blog loads, Contact Sales link present, homepage intact after navigation"
tags: ["header", "navigation", "menu", "automate"]
