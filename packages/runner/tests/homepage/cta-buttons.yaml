name: "CTA Buttons Functionality"
url: "https://www.appypieautomate.ai"
category: sanity
instructions: |
  1. On the homepage, verify the primary CTA button in the hero section is visible (e.g., "Start Free Trial", "Get Started Free", or "Start Automating")
  2. Note the text of the CTA button — do NOT click it yet
  3. Hover over the CTA button and check that it has a valid href link (it should point to a signup or registration URL)
  4. Verify the CTA button looks clickable (proper styling, not disabled)
  5. Now navigate to the Pricing page by clicking "Pricing" in the top navigation bar
  6. On the Pricing page, verify pricing plans are displayed (e.g., "Standard", "Professional", "Business")
  7. For each visible plan, verify there is a CTA button (e.g., "TRY NOW", "CONTACT US")
  8. Verify at least one plan CTA button is visible and clickable
  9. Hover over a plan CTA button and verify it has a valid href link
  10. Confirm no CTA button appears broken, missing, or leads to an error page
timeout: 90000
expected_outcome: "Homepage hero CTA is visible with valid link, Pricing page shows plan CTAs that are visible and properly linked, no broken buttons"
tags: ["cta", "buttons", "conversion", "automate"]
