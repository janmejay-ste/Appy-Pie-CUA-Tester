name: "Logo Home Navigation"
url: "https://www.appypieautomate.ai"
category: smoke
instructions: |
  1. Verify the Appy Pie Automate logo is visible in the header/navigation bar
  2. Click the "Pricing" link in the navigation menu to go to the Pricing page
  3. Verify the URL changed to include "pricing"
  4. Click the Appy Pie Automate logo in the header to go back to the homepage
  5. Verify the URL is now the homepage root "/"
  6. Click the "Explore" link in the navigation menu to go to the App Directory page
  7. Verify the URL changed to include "app-directory"
  8. Click the Appy Pie Automate logo in the header to go back to the homepage
  9. Verify the URL is now the homepage root "/" — all steps are done, report PASS
timeout: 120000
expected_outcome: "Logo is visible on all pages and clicking it consistently navigates back to the homepage from any page"
tags: ["logo", "navigation", "homepage", "automate"]
